# Available types
#   Hotkey - any hotkey from VTS.
#     In Args accepts id.
#     id mandatory. its hotkeyid.
#   Tint - change color for selected meshes
#     In Args accepts any amount of Colors, that should contain: listOfMeshes, R, G, B.
#     listOfMeshes accepts []string, with any amount of mesh names that should be colored.
#     R 0-255 of red color.
#     G 0-255 of green color.
#     B 0-255 of blue color.
#   Minecraft - execute command in minecraft server via RCON.
#     In Args accepts command, that should be executed in minecraft server.


# Example of list.yaml
Commands:
  Angry:
    Name: "Angry"
    Type: "Hotkey"
    Price: 8
    Args:
      Id: "349e5f8b62bf43bb8e47fabefd56257a"
  Cat_eyes:
    Name: "Cat eyes"
    Type: "Hotkey"
    Price: 3.3
    Args:
      Id: "bed2c8c430ef41318a5ca63fd6383950"
  Red_eyes:
    Name: "Red eyes"
    Type: "Tint"
    Price:  4
    Args:
      Color1:
        ListOfMeshes: ["ArtMesh1", "ArtMesh2", "ArtMesh63"]
        R: 255
        G: 0
        B: 0
  Bee_hair:
    Name: "Bee hair"
    Type: "Tint"
    Price: 7
    Args:
      Black:
        ListOfMeshes: ["ArtMesh115", "ArtMesh117"]
        R: 0
        G: 0
        B: 0
      Yellow:
        ListOfMeshes: ["ArtMesh114", "ArtMesh123"]
        R: 255
        G: 255
        B: 0
  Black_red_hair:
    Name: "Black red hair"
    Type: "Tint"
    Price: 7
    Args:
      Black:
        ListOfMeshes: ["ArtMesh115", "ArtMesh117"]
        R: 0
        G: 0
        B: 0
      Red:
        ListOfMeshes: ["ArtMesh114", "ArtMesh123"]
        R: 255
        G: 0
        B: 0
  Skip_time:
    Name: "Skip Half Day"
    Type: "Minecraft"
    Price: 5
    Args:
      RCONcommand: "time add 1000"
      params: 1
  Hit_with_lightning:
    Name: "Hit with lightning"
    Type: "Minecraft"
    Price: 10
    Args:
      RCONcommand: "execute as <0> at @p run summon lightning_bolt ~ ~ ~"
      params: 2